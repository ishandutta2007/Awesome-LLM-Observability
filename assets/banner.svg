<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="bannerTitle bannerDesc" preserveAspectRatio="xMidYMid meet">
  <title id="bannerTitle">Awesome LLM Observability</title>
  <desc id="bannerDesc">A curated list of SaaS platforms and open-source projects for LLM tracing, evaluation and production monitoring.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080b1a"/>
      <stop offset="45%" stop-color="#131033"/>
      <stop offset="100%" stop-color="#1b0f2e"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="traceGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.15"/>
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#070a16" stop-opacity="0.88"/>
      <stop offset="62%" stop-color="#070a16" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#070a16" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.35" fill="#ffffff" fill-opacity="0.16"/>
    </pattern>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>

    <filter id="softer" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <style><![CDATA[
    .aurora-a { animation: driftA 17s ease-in-out infinite alternate; }
    .aurora-b { animation: driftB 21s ease-in-out infinite alternate; }
    .aurora-c { animation: driftC 25s ease-in-out infinite alternate; }
    .pulse    { animation: pulse 3.4s ease-in-out infinite; transform-origin: center; }
    .sweep    { animation: sweep 4.6s linear infinite; }
    .sweep2   { animation: sweep 6.8s linear infinite; }
    .sweep3   { animation: sweep 9.2s linear infinite; }
    .blink    { animation: blink 2.2s ease-in-out infinite; }
    .float    { animation: float 6.5s ease-in-out infinite; }
    .float2   { animation: float 8.5s ease-in-out infinite reverse; }
    .dash     { stroke-dasharray: 14 22; animation: dash 3.2s linear infinite; }
    .dash2    { stroke-dasharray: 9 18; animation: dash 4.4s linear infinite reverse; }
    .tick     { animation: tick 1.6s ease-out infinite; }
    /* Text uses fill-mode "backwards" so the static (unanimated) state is the
       FINAL state: if animations never run, the title/subtitle still render
       at full opacity and can never be hidden by the dynamic layers. */
    .title    { animation: titleIn 1.1s cubic-bezier(.22,.9,.28,1) backwards; }
    .sub      { animation: titleIn 1.1s cubic-bezier(.22,.9,.28,1) .18s backwards; }
    .tag      { animation: titleIn 1.1s cubic-bezier(.22,.9,.28,1) .32s backwards; }
    .chip     { animation: titleIn 1.1s cubic-bezier(.22,.9,.28,1) .46s backwards; }

    @keyframes driftA { from { transform: translate(0,0) scale(1); } to { transform: translate(90px, 40px) scale(1.18); } }
    @keyframes driftB { from { transform: translate(0,0) scale(1.1); } to { transform: translate(-70px, 55px) scale(0.92); } }
    @keyframes driftC { from { transform: translate(0,0); } to { transform: translate(50px, -50px); } }
    @keyframes pulse { 0%,100% { opacity:.25; transform:scale(.82); } 50% { opacity:.85; transform:scale(1.18); } }
    @keyframes sweep { from { transform: translateX(-120%); } to { transform: translateX(320%); } }
    @keyframes blink { 0%,100% { opacity:.25; } 50% { opacity:1; } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-11px); } }
    @keyframes dash { to { stroke-dashoffset: -72; } }
    @keyframes tick { 0% { transform: translateY(0); opacity:0; } 30% { opacity:.9; } 100% { transform: translateY(-34px); opacity:0; } }
    @keyframes titleIn { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform: translateY(0); } }

    /* Honour reduced-motion: every layer falls back to its static, fully
       legible resting state. */
    @media (prefers-reduced-motion: reduce) {
      .aurora-a, .aurora-b, .aurora-c, .pulse, .sweep, .sweep2, .sweep3,
      .blink, .float, .float2, .dash, .dash2, .tick,
      .title, .sub, .tag, .chip { animation: none !important; }
    }
  ]]></style>

  <!-- ================= BACKGROUND LAYER ================= -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#dots)"/>

  <g filter="url(#soft)" opacity="0.85">
    <ellipse class="aurora-a" cx="170" cy="110" rx="210" ry="150" fill="url(#glowCyan)"/>
    <ellipse class="aurora-b" cx="1040" cy="290" rx="230" ry="160" fill="url(#glowPink)"/>
    <ellipse class="aurora-c" cx="600" cy="40" rx="260" ry="110" fill="url(#glowViolet)"/>
  </g>

  <!-- animated trace waterfall (background) -->
  <g opacity="0.42" filter="url(#softer)">
    <rect x="60"  y="318" width="200" height="7" rx="3.5" fill="url(#traceGrad)"/>
    <rect x="60"  y="336" width="300" height="7" rx="3.5" fill="url(#traceGrad)" opacity="0.7"/>
    <rect x="60"  y="354" width="140" height="7" rx="3.5" fill="url(#traceGrad)" opacity="0.5"/>
    <rect x="880" y="46"  width="260" height="7" rx="3.5" fill="url(#traceGrad)" opacity="0.8"/>
    <rect x="960" y="64"  width="180" height="7" rx="3.5" fill="url(#traceGrad)" opacity="0.55"/>
  </g>

  <!-- flowing trace edges -->
  <g fill="none" stroke-linecap="round" stroke-width="1.6">
    <path class="dash" d="M40 300 C 180 300 220 356 360 356 S 620 300 760 300" stroke="#22d3ee" stroke-opacity="0.5"/>
    <path class="dash2" d="M300 44 C 460 44 520 96 700 96 S 980 44 1160 44" stroke="#a78bfa" stroke-opacity="0.45"/>
    <path class="dash" d="M40 150 C 120 150 150 190 240 190" stroke="#f472b6" stroke-opacity="0.35" style="animation-duration:5.4s"/>
  </g>

  <!-- moving particles along the trace edges -->
  <g>
    <circle class="sweep" cx="0" cy="300" r="3.4" fill="#22d3ee"/>
    <circle class="sweep2" cx="0" cy="44" r="3.0" fill="#a78bfa"/>
    <circle class="sweep3" cx="0" cy="150" r="2.6" fill="#f472b6"/>
  </g>

  <!-- pulsing nodes -->
  <g>
    <circle class="pulse" cx="92"  cy="300" r="9" fill="none" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="1.4"/>
    <circle class="pulse" cx="1120" cy="96" r="8" fill="none" stroke="#f472b6" stroke-opacity="0.55" stroke-width="1.4" style="animation-delay:.8s"/>
    <circle class="pulse" cx="640" cy="26"  r="7" fill="none" stroke="#a78bfa" stroke-opacity="0.5"  stroke-width="1.4" style="animation-delay:1.5s"/>
  </g>

  <!-- rising telemetry ticks (background, away from the text block) -->
  <g fill="#22d3ee" fill-opacity="0.55">
    <rect class="tick" x="84"  y="250" width="3" height="26" rx="1.5"/>
    <rect class="tick" x="96"  y="258" width="3" height="18" rx="1.5" style="animation-delay:.4s"/>
    <rect class="tick" x="108" y="246" width="3" height="30" rx="1.5" style="animation-delay:.8s"/>
    <rect class="tick" x="1080" y="252" width="3" height="24" rx="1.5" style="animation-delay:1.1s"/>
    <rect class="tick" x="1092" y="260" width="3" height="16" rx="1.5" style="animation-delay:1.5s"/>
    <rect class="tick" x="1104" y="248" width="3" height="28" rx="1.5" style="animation-delay:.2s"/>
  </g>

  <!-- ================= FOREGROUND LAYER ================= -->
  <!-- soft plate keeps the title + subtitle fully legible over every animated layer -->
  <rect x="150" y="96" width="900" height="212" rx="28" fill="#070a16" fill-opacity="0.42"/>
  <rect x="150" y="96" width="900" height="212" rx="28" fill="none" stroke="url(#accent)" stroke-opacity="0.35" stroke-width="1.2"/>
  <rect width="1200" height="400" fill="url(#vignette)" style="mix-blend-mode:normal" opacity="0.85" transform="translate(0,0)"/>

  <!-- corner telemetry badges: animated, but painted BEFORE the text layer so the
       title and subtitle are always the topmost pixels and can never be covered -->
  <g class="float" opacity="0.9">
    <circle class="blink" cx="176" cy="70" r="5" fill="#34d399"/>
    <text x="190" y="75" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#34d399" letter-spacing="1.5">LIVE</text>
  </g>
  <g class="float2" opacity="0.9">
    <circle class="blink" cx="1000" cy="360" r="5" fill="#fbbf24" style="animation-delay:1s"/>
    <text x="1014" y="365" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#fbbf24" letter-spacing="1.5">OTEL 1.30+</text>
  </g>

  <g text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <g class="title">
      <text x="600" y="172" font-size="62" font-weight="800" letter-spacing="1" fill="#ffffff">
        Awesome LLM Observability
      </text>
      <rect x="300" y="190" width="600" height="3" rx="1.5" fill="url(#accent)" opacity="0.9"/>
    </g>

    <g class="sub">
      <text x="600" y="232" font-size="25" font-weight="500" fill="#c7d2fe">
        Curated SaaS platforms &amp; open-source projects for LLM tracing,
      </text>
      <text x="600" y="264" font-size="25" font-weight="500" fill="#c7d2fe">
        evaluation, cost tracking &amp; production monitoring
      </text>
    </g>

    <g class="tag" font-size="17" fill="#8fa0c8" letter-spacing="2.4">
      <text x="600" y="296">TRACING · EVALUATION · GUARDRAILS · COST · OPENTELEMETRY</text>
    </g>
  </g>

  <!-- foreground chips (placed below the text block, never over it) -->
  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <g class="chip">
      <rect x="398" y="330" width="150" height="30" rx="15" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.55"/>
      <text x="473" y="350" fill="#7dd3fc">SaaS Platforms</text>
    </g>
    <g class="chip" style="animation-delay:.58s">
      <rect x="556" y="330" width="182" height="30" rx="15" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.55"/>
      <text x="647" y="350" fill="#c4b5fd">Open-Source Repos</text>
    </g>
    <g class="chip" style="animation-delay:.70s">
      <rect x="746" y="330" width="152" height="30" rx="15" fill="#f472b6" fill-opacity="0.14" stroke="#f472b6" stroke-opacity="0.55"/>
      <text x="822" y="350" fill="#f9a8d4">OTel Native</text>
    </g>
  </g>

</svg>
